name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Build Chrome and Firefox bundles
        run: npm run build

      - name: Package release archives
        run: |
          (cd dist/chrome && zip -r ../../currency-lens-chrome.zip .)
          (cd dist/firefox && zip -r ../../currency-lens-firefox.zip .)
          sha256sum currency-lens-chrome.zip currency-lens-firefox.zip > SHA256SUMS

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            currency-lens-chrome.zip
            currency-lens-firefox.zip
            SHA256SUMS
