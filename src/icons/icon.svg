<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <mask id="front-cutout">
      <rect width="128" height="128" fill="white"/>
      <!-- Clean gap between front and back coins -->
      <circle cx="48" cy="76" r="46" fill="black"/>
    </mask>
  </defs>
  <!-- Back coin (visible on both dark and light browser toolbars) -->
  <g mask="url(#front-cutout)">
    <circle cx="84" cy="44" r="36" fill="#52525b" stroke="#e4e4e7" stroke-width="6"/>
  </g>
  <!-- Front coin -->
  <circle cx="48" cy="76" r="40" fill="#f4f4f5" stroke="#18181b" stroke-width="4"/>
  <!-- Bold, crisp $ mark readable even at 16px -->
  <path d="M48 48 V104" stroke="#18181b" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M61 62 C61 55.5 55.5 52.5 48 52.5 C40.5 52.5 35.5 56 35.5 61.5 C35.5 67 40.5 69.5 48 71.5 C55.5 73.5 61.5 76.5 61.5 83 C61.5 89.5 55.5 93 48 93 C40.5 93 35 89.5 35 83" fill="none" stroke="#18181b" stroke-width="8.5" stroke-linecap="round"/>
</svg>
